<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a10"/><stop offset="1" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFF4F"/><stop offset="1" stop-color="#00E05A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- faint chart grid -->
  <g stroke="#1f3a24" stroke-width="2" opacity="0.7">
    <path d="M64 160H448M64 256H448M64 352H448M160 64V448M256 64V448M352 64V448"/>
  </g>
  <!-- antenna with bolt -->
  <g stroke="#39FF14" stroke-linecap="round" fill="none">
    <path d="M256 128V84" stroke-width="22" opacity="0.18"/>
    <path d="M256 128V84" stroke-width="12"/>
  </g>
  <path d="M262 30 L232 74 H254 L244 108 L282 58 H258 Z" fill="url(#g)"/>
  <!-- head: glow layers then the solid outline -->
  <rect x="104" y="128" width="304" height="268" rx="64" fill="none" stroke="#39FF14" stroke-width="40" opacity="0.10"/>
  <rect x="104" y="128" width="304" height="268" rx="64" fill="none" stroke="#39FF14" stroke-width="26" opacity="0.22"/>
  <rect x="104" y="128" width="304" height="268" rx="64" fill="#07120a" stroke="url(#g)" stroke-width="14"/>
  <!-- ears -->
  <rect x="74" y="222" width="30" height="80" rx="12" fill="url(#g)"/>
  <rect x="408" y="222" width="30" height="80" rx="12" fill="url(#g)"/>
  <!-- eyes: YES up, NO down -->
  <path d="M196 196 L238 260 H154 Z" fill="url(#g)"/>
  <path d="M316 260 L274 196 H358 Z" fill="#ffffff"/>
  <!-- mouth: three candles -->
  <g fill="url(#g)">
    <rect x="183" y="300" width="22" height="58" rx="5"/><rect x="192" y="290" width="4" height="78" rx="2"/>
    <rect x="245" y="312" width="22" height="40" rx="5"/><rect x="254" y="300" width="4" height="66" rx="2"/>
    <rect x="307" y="294" width="22" height="66" rx="5"/><rect x="316" y="284" width="4" height="86" rx="2"/>
  </g>
</svg>
